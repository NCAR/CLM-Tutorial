# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: CLM Tutorial
author: NCAR/CGD Staff
logo: images/ncar_logo.png

exclude_patterns:
  - notebooks/diagnostics/additional/cvdp.ipynb
  - notebooks/intro/cesm_expts/**
  - notebooks/intro/community_experiments.ipynb
  - notebooks/sourcemods/**
  - notebooks/resources/ncar_hpc_login.ipynb
  - notebooks/resources/porting.ipynb
  - notebooks/resources/profile.ipynb
  - notebooks/resources/tutorial_specific.ipynb
  - notebooks/troubleshooting/exercises_overview.ipynb
  - notebooks/troubleshooting/exercises/troubleshooting_cam.ipynb
  - notebooks/diagnostics/hillslope

sphinx:
  config:
    html_show_copyright: false
    html_theme_options:
      show_navbar_depth: 1

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
#execute:
#  execute_notebooks: force

execute:
  execute_notebooks: 'off'


# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: tutorial_book.tex

# Add a bibtex file so that we can create citations
#bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/NCAR/CLM-Tutorial  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_repository_button: true
  use_edit_page_button : false
  use_issues_button    : true
  home_page_in_navbar  : true
  use_multitoc_numbering    : true
  extra_navbar              : ""

parse:
  # Jinja-2 Substitutions to make throughout all notebooks
  # For example add:
  # {{ CTSM_TUTORIAL_TAG }}
  # For code blocks (make the code block a parsed-literal and do this:
  # {{ '`' + CTSM_TUTORIAL_TAG + '`' }}
  # To have it substitute the above from the substitutions.yml file below
  # NOTE: this won't work for raw HTML blocks in markdown, so make the substitution outside of raw HTML.
  myst_substitutions:
      CTSM_TUTORIAL_TAG: "`ctsm5.4.067`"
      CTSM_CUPID_TAG: "`CUPiD.n01_ctsm5.4.017`"
      PROJECT_CODE: "PUCGD0011"
      TUTORIAL_QUE: "tutorial"

launch_buttons:
  binder             : false
  binderhub          : false
    #binderhub_url: https://mybinder.org
  jupyterhub         : false
  thebe              : false
  colab              : false


