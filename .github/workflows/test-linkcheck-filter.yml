name: Test link-check log filter

# The PR comment for a failed link check shows only the problematic-URL and warning/error lines,
# picked out by filter-linkcheck-log.sh from the link checker's output.json and from how Sphinx
# prints warnings. Re-test that whenever something that could change either (package or Python
# versions, the link-check command) changes.
# Path filters work per file, so this runs on any change to gh-page_builder.yml, not just to its
# Python version.
on:
  pull_request:
    paths:
      - requirements.txt
      - .github/workflows/gh-page_builder.yml
      - .github/workflows/test-linkcheck-filter.yml
      - .github/scripts/run-linkcheck.sh
      - .github/scripts/filter-linkcheck-log.sh
      - .github/scripts/test-linkcheck-filter.sh
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'NCAR/CLM-Tutorial'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # Use the same Python version as the real link check.
    - name: Get Python version from gh-page_builder.yml
      id: python-version
      run: |
        version="$(yq '.env.PYTHON_VERSION' .github/workflows/gh-page_builder.yml)"
        if [[ -z "$version" || "$version" == null ]]; then
          echo "::error::Couldn't read env.PYTHON_VERSION from gh-page_builder.yml"
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ steps.python-version.outputs.version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Test link-check log filter
      run: bash .github/scripts/test-linkcheck-filter.sh
